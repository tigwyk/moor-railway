# mooR on Railway - Multi-Service Configuration
# All services pull from pre-built DockerHub images

# ============================================================================
# DAEMON SERVICE - Core MOO database and RPC server
# ============================================================================
[daemon]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.daemon"

[daemon.deploy]
restartPolicyType = "ALWAYS"
startCommand = ""

# Expose all TCP ports for inter-service communication
[[daemon.ports]]
port = 7899
type = "TCP"

[[daemon.ports]]
port = 7898
type = "TCP"

[[daemon.ports]]
port = 7897
type = "TCP"

[[daemon.ports]]
port = 7896
type = "TCP"

[[daemon.ports]]
port = 7900
type = "TCP"

# Persistent volume for database
[[daemon.volumes]]
type = "persistent"
name = "daemon-data"
mountPath = "/data"

[daemon.env]
# Use DockerHub image
RAILWAY_DEPLOY_IMAGE_NAME = "tigwyk/moor-daemon:latest"

# Core configuration
IMPORT_PATH = "/data/cores/cowbell/src"
USE_BOOLEAN_RETURNS = "true"
CUSTOM_ERRORS = "true"
USE_UUOBJIDS = "true"
ANONYMOUS_OBJECTS = "true"
ENABLE_EVENTLOG = "true"

# ============================================================================
# TELNET SERVICE - Classic telnet interface
# ============================================================================
[telnet]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.telnet"

[telnet.deploy]
restartPolicyType = "ALWAYS"
startCommand = ""

[[telnet.ports]]
port = 8888
type = "TCP"

[[telnet.volumes]]
type = "persistent"
name = "telnet-data"
mountPath = "/data"

[telnet.env]
# Use DockerHub image
RAILWAY_DEPLOY_IMAGE_NAME = "tigwyk/moor-telnet-host:latest"

# Connect to daemon via Railway service discovery
DAEMON_SERVICE_NAME = "daemon"
DAEMON_RPC_PORT = "7899"
DAEMON_EVENTS_PORT = "7898"
DAEMON_ENROLLMENT_PORT = "7900"

# ============================================================================
# WEB HOST SERVICE - HTTP/WebSocket API
# ============================================================================
[webhost]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web-host.railway"

[webhost.deploy]
restartPolicyType = "ALWAYS"
startCommand = ""

[[webhost.ports]]
port = 8081
type = "TCP"

[[webhost.volumes]]
type = "persistent"
name = "webhost-data"
mountPath = "/data"

[webhost.env]
# Use DockerHub image
RAILWAY_DEPLOY_IMAGE_NAME = "tigwyk/moor-web-host:latest"

# Connect to daemon via Railway service discovery
DAEMON_SERVICE_NAME = "daemon"
DAEMON_RPC_PORT = "7899"
DAEMON_EVENTS_PORT = "7898"
DAEMON_ENROLLMENT_PORT = "7900"

# ============================================================================
# WORKER SERVICE - Background HTTP request processing
# ============================================================================
[worker]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker.railway"

[worker.deploy]
restartPolicyType = "ALWAYS"
startCommand = ""

[[worker.volumes]]
type = "persistent"
name = "worker-data"
mountPath = "/data"

[worker.env]
# Use DockerHub image
RAILWAY_DEPLOY_IMAGE_NAME = "tigwyk/moor-worker:latest"

# Connect to daemon via Railway service discovery
DAEMON_SERVICE_NAME = "daemon"
DAEMON_RPC_PORT = "7899"
DAEMON_EVENTS_PORT = "7898"
DAEMON_WORKERS_REQUEST_PORT = "7896"
DAEMON_WORKERS_RESPONSE_PORT = "7897"
DAEMON_ENROLLMENT_PORT = "7900"

# ============================================================================
# FRONTEND SERVICE - Meadow web UI
# ============================================================================
[frontend]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.frontend.railway"

[frontend.deploy]
restartPolicyType = "ALWAYS"
startCommand = ""
healthcheckPath = "/"

[[frontend.ports]]
port = 80
type = "HTTP"

[frontend.env]
# Use DockerHub image
RAILWAY_DEPLOY_IMAGE_NAME = "tigwyk/moor-frontend:latest"

# Connect to webhost via Railway service discovery
WEB_HOST_SERVICE_NAME = "webhost"
WEB_HOST_PORT = "8081"
