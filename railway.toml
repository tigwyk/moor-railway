# mooR Multi-Service Railway Configuration
# https://docs.railway.com/deployments/monorepo

# Daemon Service - Core MOO database and RPC server
[daemon.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"
buildTimeout = 1800

[daemon.deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"

[[daemon.deploy.volumes]]
type = "persistent"
name = "data"
mountPath = "/data"

[[daemon.deploy.ports]]
port = 7899
type = "TCP"

[[daemon.deploy.ports]]
port = 7898
type = "TCP"

[[daemon.deploy.ports]]
port = 7897
type = "TCP"

[[daemon.deploy.ports]]
port = 7896
type = "TCP"

[[daemon.deploy.ports]]
port = 7900
type = "TCP"

[daemon.env]
BUILD_PROFILE = "release-fast"
IMPORT_PATH = "/data/cores/cowbell/src"
USE_BOOLEAN_RETURNS = "true"
CUSTOM_ERRORS = "true"
USE_UUOBJIDS = "true"
ANONYMOUS_OBJECTS = "true"
ENABLE_EVENTLOG = "true"

# Telnet Host Service
[telnet.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.telnet"
buildTimeout = 1800

[telnet.deploy]
restartPolicyType = "ALWAYS"

[[telnet.deploy.volumes]]
type = "persistent"
name = "telnet-data"
mountPath = "/data"

[[telnet.deploy.ports]]
port = 8888
type = "TCP"

[telnet.env]
BUILD_PROFILE = "release-fast"

# Web Host Service
[webhost.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.web-host.railway"
buildTimeout = 1800

[webhost.deploy]
restartPolicyType = "ALWAYS"

[[webhost.deploy.volumes]]
type = "persistent"
name = "web-data"
mountPath = "/data"

[[webhost.deploy.ports]]
port = 8081
type = "TCP"

[webhost.env]
BUILD_PROFILE = "release-fast"

# Worker Service
[worker.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.worker.railway"
buildTimeout = 1800

[worker.deploy]
restartPolicyType = "ALWAYS"

[[worker.deploy.volumes]]
type = "persistent"
name = "worker-data"
mountPath = "/data"

[worker.env]
BUILD_PROFILE = "release-fast"

# Frontend Service
[frontend.build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.frontend.railway"
buildTimeout = 1800

[frontend.deploy]
restartPolicyType = "ALWAYS"
healthcheckPath = "/"

[[frontend.deploy.ports]]
port = 80
type = "HTTP"
