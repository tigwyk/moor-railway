# mooR Railway Monorepo Configuration
# Each service uses a Dockerfile that extends pre-built DockerHub images

# ============================================================================
# DAEMON SERVICE
# ============================================================================
[daemon.build]
dockerfilePath = "Dockerfile.daemon"

[daemon.deploy]
restartPolicyType = "ALWAYS"
numReplicas = 1

[[daemon.ports]]
port = 7899
type = "TCP"

[[daemon.ports]]
port = 7898
type = "TCP"

[[daemon.ports]]
port = 7897
type = "TCP"

[[daemon.ports]]
port = 7896
type = "TCP"

[[daemon.ports]]
port = 7900
type = "TCP"

[[daemon.volumes]]
type = "persistent"
name = "daemon-data"
mountPath = "/data"

[daemon.env]
IMPORT_PATH = "/data/cores/cowbell/src"
USE_BOOLEAN_RETURNS = "true"
CUSTOM_ERRORS = "true"
USE_UUOBJIDS = "true"
ANONYMOUS_OBJECTS = "true"
ENABLE_EVENTLOG = "true"

# ============================================================================
# TELNET SERVICE
# ============================================================================
[telnet.build]
dockerfilePath = "Dockerfile.telnet"

[telnet.deploy]
restartPolicyType = "ALWAYS"
numReplicas = 1

[[telnet.ports]]
port = 8888
type = "TCP"

[[telnet.volumes]]
type = "persistent"
name = "telnet-data"
mountPath = "/data"

[telnet.env]
DAEMON_HOST = "daemon.railway.internal"
DAEMON_RPC_PORT = "7899"
DAEMON_EVENTS_PORT = "7898"
DAEMON_ENROLLMENT_PORT = "7900"

# ============================================================================
# WEB HOST SERVICE
# ============================================================================
[webhost.build]
dockerfilePath = "Dockerfile.webhost"

[webhost.deploy]
restartPolicyType = "ALWAYS"
numReplicas = 1

[[webhost.ports]]
port = 8081
type = "TCP"

[[webhost.volumes]]
type = "persistent"
name = "webhost-data"
mountPath = "/data"

[webhost.env]
DAEMON_HOST = "daemon.railway.internal"
DAEMON_RPC_PORT = "7899"
DAEMON_EVENTS_PORT = "7898"
DAEMON_ENROLLMENT_PORT = "7900"

# ============================================================================
# WORKER SERVICE
# ============================================================================
[worker.build]
dockerfilePath = "Dockerfile.worker"

[worker.deploy]
restartPolicyType = "ALWAYS"
numReplicas = 1

[[worker.volumes]]
type = "persistent"
name = "worker-data"
mountPath = "/data"

[worker.env]
DAEMON_HOST = "daemon.railway.internal"
DAEMON_RPC_PORT = "7899"
DAEMON_EVENTS_PORT = "7898"
DAEMON_WORKERS_REQUEST_PORT = "7896"
DAEMON_WORKERS_RESPONSE_PORT = "7897"
DAEMON_ENROLLMENT_PORT = "7900"

# ============================================================================
# MCP GATEWAY SERVICE
# ============================================================================
[mcp-gateway.build]
dockerfilePath = "Dockerfile.mcp-gateway"

[mcp-gateway.deploy]
restartPolicyType = "ALWAYS"
numReplicas = 1

[[mcp-gateway.volumes]]
type = "persistent"
name = "mcp-gateway-data"
mountPath = "/data"

[mcp-gateway.env]
DAEMON_HOST = "daemon.railway.internal"
DAEMON_RPC_PORT = "7899"
DAEMON_EVENTS_PORT = "7898"
DAEMON_ENROLLMENT_PORT = "7900"
MCP_CREATION_POLICY = "open"

# ============================================================================
# FRONTEND SERVICE
# ============================================================================
[frontend.build]
dockerfilePath = "Dockerfile.frontend"

[frontend.deploy]
restartPolicyType = "ALWAYS"
numReplicas = 1
healthcheckPath = "/"

[[frontend.ports]]
port = 80
type = "HTTP"

[frontend.env]
WEB_HOST_SERVICE_NAME = "webhost"
WEB_HOST_PORT = "8081"
