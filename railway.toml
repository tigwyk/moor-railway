[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.railway"
buildTimeout = 1800

[deploy]
startCommand = ""
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ALWAYS"

# Daemon needs persistent volume for database
[[services.volumes]]
type = "persistent"
name = "data"
mountPath = "/data"

# Expose RPC and events ports for other services to connect
[[services.ports]]
port = 7899
type = "TCP"

[[services.ports]]
port = 7898
type = "TCP"

[[services.ports]]
port = 7900
type = "TCP"

[env]
BUILD_PROFILE = "release-fast"
RUN_DIR = "run-cowbell"
IMPORT_PATH = "/data/cores/cowbell/src"
USE_BOOLEAN_RETURNS = "true"
CUSTOM_ERRORS = "true"
USE_UUOBJIDS = "true"
ANONYMOUS_OBJECTS = "true"
ENABLE_EVENTLOG = "true"
