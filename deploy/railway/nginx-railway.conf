events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Resolved at container startup from /etc/resolv.conf by entrypoint script.
    # Re-resolve every 10s so service startup order doesn't matter.
    resolver __RESOLVER__ valid=10s;

    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;

            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        location /v1/ {
            set $webhost webhost.railway.internal:8081;
            proxy_pass http://$webhost;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            set $webhost webhost.railway.internal:8081;
            proxy_pass http://$webhost;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ~ ^/(health|version)$ {
            set $webhost webhost.railway.internal:8081;
            proxy_pass http://$webhost;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            set $webhost webhost.railway.internal:8081;
            proxy_pass http://$webhost;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
        }

        location /webhooks/ {
            set $webhost webhost.railway.internal:8081;
            proxy_pass http://$webhost;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /mcp → StreamableHTTP (current standard), /mcp/sse → SSE (legacy)
        # Only rewrite subpaths that need prefix stripping (sse, messages).
        location /mcp {
            set $mcp_gateway mcp-gateway.railway.internal:8090;
            rewrite ^/mcp/(sse|messages?)(.*)$ /$1$2 break;
            proxy_pass http://$mcp_gateway;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 60s;
            proxy_buffering off;
            proxy_cache off;
        }

        # Serve skill files for AI agents (OpenClaw/Moltbot compatible)
        location = /skill.md {
            alias /usr/share/nginx/html/skill.md;
            default_type text/markdown;
            add_header Cache-Control "public, max-age=300";
        }
        location = /heartbeat.md {
            alias /usr/share/nginx/html/heartbeat.md;
            default_type text/markdown;
            add_header Cache-Control "public, max-age=300";
        }
        location = /exploration.md {
            alias /usr/share/nginx/html/exploration.md;
            default_type text/markdown;
            add_header Cache-Control "public, max-age=300";
        }
        location = /building.md {
            alias /usr/share/nginx/html/building.md;
            default_type text/markdown;
            add_header Cache-Control "public, max-age=300";
        }
        location = /skill.json {
            alias /usr/share/nginx/html/skill.json;
            default_type application/json;
            add_header Cache-Control "public, max-age=300";
        }
    }
}
